name: Release

# Pushing a tag vX.Y.Z publishes that commit's plugin zip as a GitHub Release.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # to check the tagged commit is on main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The version Decky shows comes from package.json: the tag has to name it, and only a commit
      # that went through main (and its CI) is released.
      - name: Check the tag
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi

      # A release build: no development identity, so the Developer section stays hidden.
      - uses: ./.github/actions/build-plugin
        with:
          commit: ${{ github.sha }}

      # Decky installs a zip by the plugin's name inside it; the asset keeps the plain name people expect.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "$(ls out/*.zip)" "$RUNNER_TEMP/Decky-Framegen.zip"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Decky-Framegen.zip" --verify-tag \
            --title "Decky Framegen ${GITHUB_REF_NAME#v}" --generate-notes
