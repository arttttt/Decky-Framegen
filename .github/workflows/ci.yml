name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run builds and checks a release package (no development identity).
  workflow_dispatch:

# A new push to a pull request supersedes the run still going for it; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the language floor of main.py; 3.14 is what Decky Loader ships.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck defaults/assets/*.sh

  package:
    name: Plugin package (Decky CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes development builds as prereleases
      pull-requests: read  # checks the pull request is still open after publishing
    env:
      DECKY_CLI_VERSION: "0.0.8"
      DECKY_CLI_SHA256: "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0"
      # Pushes to main and pull requests from this repository are development builds;
      # pull requests from forks are built and checked as release builds.
      DEV_BUILD: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      # A pull request is built from its head commit, the one its development build is named after.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Stamp the development build
        id: stamp
        if: env.DEV_BUILD == 'true'
        # An explicit bash runs with pipefail, so a refused stamp fails the step instead of
        # passing through tee and leaving a build that looks like a release.
        shell: bash
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python scripts/stamp_dev_build.py --repository "$GITHUB_REPOSITORY" --commit "$COMMIT" \
            ${PULL_REQUEST:+--pull-request "$PULL_REQUEST" --pull-request-title "$PULL_REQUEST_TITLE"} \
            | tee -a "$GITHUB_OUTPUT"

      - name: Install Decky CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/decky" \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/${DECKY_CLI_VERSION}/decky-linux-x86_64"
          echo "${DECKY_CLI_SHA256}  $RUNNER_TEMP/decky" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/decky"

      # The same build a release uses: frontend in Decky's builder image, py_modules bundled.
      - name: Build plugin
        run: |
          "$RUNNER_TEMP/decky" plugin build . --output-path out
          ls -l out

      # A separate assignment fails the step when no zip was built (bash -e), and a
      # non-empty PLUGIN_ZIP means the package tests run instead of being skipped.
      - name: Check the package
        env:
          BUILD_CHANNEL: ${{ steps.stamp.outputs.channel }}
          BUILD_COMMIT: ${{ env.COMMIT }}
          BUILD_VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          python -m pip install -r requirements-dev.txt
          plugin_zip="$(ls out/*.zip)"
          PLUGIN_ZIP="$plugin_zip" python -m pytest tests/test_package.py -v -rs

      # Replaces the channel's prerelease: the tag moves to this commit and the old asset goes.
      # Never a draft (unauthenticated listings don't show drafts) and never the latest release.
      - name: Publish the development build
        if: env.DEV_BUILD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.stamp.outputs.channel }}
          ASSET: ${{ steps.stamp.outputs.asset }}
          TITLE: ${{ steps.stamp.outputs.title }}
          VERSION: ${{ steps.stamp.outputs.version }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          plugin_zip="$(ls out/*.zip)"
          cp "$plugin_zip" "$RUNNER_TEMP/$ASSET"
          if gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release delete "$CHANNEL" --cleanup-tag --yes
          fi
          gh release create "$CHANNEL" "$RUNNER_TEMP/$ASSET" --target "$COMMIT" \
            --prerelease --latest=false --title "$TITLE" \
            --notes "Development build $VERSION of $COMMIT. Installable from the plugin's Developer section."
          # Closing the pull request while this ran may have let its cleanup finish first;
          # then this release would outlive it, so it goes now.
          if [[ -n "$PULL_REQUEST" && "$(gh pr view "$PULL_REQUEST" --json state --jq .state)" != "OPEN" ]]; then
            gh release delete "$CHANNEL" --cleanup-tag --yes
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: out/*.zip
          if-no-files-found: error
