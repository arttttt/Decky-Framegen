name: Build the plugin
description: >
  Builds the plugin zip with Decky CLI, the same way for development builds and releases, and checks
  the package. The zip lands in out/.
inputs:
  channel:
    description: The stamped build's channel (stable, dev, pr-N); empty for an unstamped build (a fork's pull request).
    default: ""
  commit:
    description: The commit the build is made from.
    required: true
  version:
    description: The stamped build's version; empty for an unstamped build.
    default: ""
runs:
  using: composite
  steps:
    - name: Install Decky CLI
      shell: bash
      env:
        DECKY_CLI_VERSION: "0.0.8"
        DECKY_CLI_SHA256: "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0"
      run: |
        curl -fsSL -o "$RUNNER_TEMP/decky" \
          "https://github.com/SteamDeckHomebrew/cli/releases/download/${DECKY_CLI_VERSION}/decky-linux-x86_64"
        echo "${DECKY_CLI_SHA256}  $RUNNER_TEMP/decky" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/decky"

    # OptiScaler ships .7z archives (the stable ones with BCJ2), so the plugin carries the official
    # statically linked 7-Zip (7zzs, LGPL) with its license; Decky CLI puts defaults/* at the plugin root.
    - name: Bundle 7-Zip
      shell: bash
      env:
        SEVEN_ZIP_VERSION: "26.05"
        SEVEN_ZIP_SHA256: "22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e"
      run: |
        curl -fsSL -o "$RUNNER_TEMP/7z.tar.xz" \
          "https://github.com/ip7z/7zip/releases/download/${SEVEN_ZIP_VERSION}/7z${SEVEN_ZIP_VERSION//./}-linux-x64.tar.xz"
        echo "${SEVEN_ZIP_SHA256}  $RUNNER_TEMP/7z.tar.xz" | sha256sum -c -
        mkdir -p defaults/tools
        tar -xf "$RUNNER_TEMP/7z.tar.xz" -C defaults/tools --no-same-owner 7zzs License.txt
        mv defaults/tools/License.txt defaults/tools/7zzs-License.txt

    # Frontend in Decky's builder image, py_modules bundled.
    - name: Build plugin
      shell: bash
      run: |
        "$RUNNER_TEMP/decky" plugin build . --output-path out
        ls -l out

    # A separate assignment fails the step when no zip was built (bash -e), and a
    # non-empty PLUGIN_ZIP means the package tests run instead of being skipped.
    - name: Check the package
      shell: bash
      env:
        BUILD_CHANNEL: ${{ inputs.channel }}
        BUILD_COMMIT: ${{ inputs.commit }}
        BUILD_VERSION: ${{ inputs.version }}
      run: |
        python -m pip install -r requirements-dev.txt
        plugin_zip="$(ls out/*.zip)"
        PLUGIN_ZIP="$plugin_zip" python -m pytest tests/test_package.py -v -rs
